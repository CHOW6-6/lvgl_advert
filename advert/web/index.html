<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEEPSEEK 广告机 · 素材上传</title>
<style>
  :root{
    --bg:#F4F7F9; --surface:#fff; --ink:#1F2A33; --ink2:#5A6B7A;
    --muted:#93A3B1; --line:#E7EEF3; --mint:#3EBFB0; --mint-deep:#2A9D90;
    --mint-soft:#E4F5F2; --amber:#F2B25C; --red:#E4695E;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  header{
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:18px 28px; display:flex; align-items:center; gap:16px;
    position:sticky; top:0; z-index:10;
  }
  .logo{font-weight:700; letter-spacing:3px; font-size:19px}
  .sep{width:1px; height:20px; background:var(--line)}
  .sub{color:var(--muted); font-size:13px}
  .status{margin-left:auto; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .dot.ok{background:var(--mint)} .dot.bad{background:var(--red)}

  main{max-width:1120px; margin:0 auto; padding:24px 28px 60px}
  .grid{display:grid; grid-template-columns:1fr 380px; gap:20px; align-items:start}
  @media(max-width:900px){ .grid{grid-template-columns:1fr} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px}
  .card h2{margin:0 0 18px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:9px}
  .card h2::before{content:""; width:3px; height:15px; border-radius:2px; background:var(--mint)}

  label{display:block; font-size:13px; color:var(--ink2); margin:16px 0 6px}
  label .req{color:var(--red)}
  input[type=text],input[type=number]{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font:inherit; color:var(--ink); background:#FBFDFE; outline:none; transition:.15s;
  }
  input[type=text]:focus,input[type=number]:focus{border-color:var(--mint); background:#fff}
  .hint{font-size:12px; color:var(--muted); margin-top:5px}

  .drop{
    border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center;
    color:var(--muted); font-size:13px; cursor:pointer; transition:.15s; background:#FBFDFE;
  }
  .drop:hover,.drop.over{border-color:var(--mint); background:var(--mint-soft); color:var(--mint-deep)}
  .drop .big{font-size:14px; color:var(--ink2); margin-bottom:4px}
  .drop.has{border-style:solid; border-color:var(--mint); background:var(--mint-soft); color:var(--mint-deep)}
  .drop.has .big{color:var(--mint-deep); font-weight:600}

  details{margin-top:18px; border-top:1px solid var(--line); padding-top:14px}
  details summary{cursor:pointer; font-size:13px; color:var(--ink2); outline:none}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}

  button{
    font:inherit; border:0; border-radius:10px; cursor:pointer; transition:.15s;
  }
  .primary{
    width:100%; margin-top:22px; padding:13px; background:var(--mint); color:#fff;
    font-weight:600; letter-spacing:1px;
  }
  .primary:hover{background:var(--mint-deep)}
  .primary:disabled{background:var(--line); color:var(--muted); cursor:not-allowed}

  .progress{margin-top:16px; display:none}
  .progress.show{display:block}
  .bar{height:6px; background:var(--line); border-radius:3px; overflow:hidden}
  .bar > i{display:block; height:100%; width:0; background:var(--mint); transition:width .25s}
  .ptext{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:7px}
  .msg{margin-top:12px; font-size:13px; padding:10px 12px; border-radius:10px; display:none}
  .msg.show{display:block}
  .msg.ok{background:var(--mint-soft); color:var(--mint-deep)}
  .msg.err{background:#FDEDEB; color:var(--red)}

  .list{max-height:520px; overflow:auto; margin:-6px -6px 0; padding:6px}
  .item{display:flex; gap:10px; padding:11px 8px; border-bottom:1px solid var(--line); align-items:flex-start}
  .item:last-child{border-bottom:0}
  .tag{flex:none; font-size:11px; padding:2px 7px; border-radius:5px; color:#fff; margin-top:2px}
  .tag.v{background:var(--mint)} .tag.i{background:var(--amber)}
  .it-body{flex:1; min-width:0}
  .it-title{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .it-remark{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .del{flex:none; background:transparent; color:var(--muted); font-size:12px; padding:3px 7px; border-radius:6px}
  .del:hover{background:#FDEDEB; color:var(--red)}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:26px 0}
</style>
</head>
<body>

<header>
  <span class="logo">DEEPSEEK</span>
  <span class="sep"></span>
  <span class="sub">广告机 · 素材上传</span>
  <span class="status"><span class="dot" id="dot"></span><span id="boardText">连接中…</span></span>
</header>

<main>
<div class="grid">

  <section class="card">
    <h2>上传新广告</h2>

    <label>广告标题 <span class="req">*</span></label>
    <input type="text" id="title" maxlength="30" placeholder="例如：臻蓝系列 · 机械腕表">

    <label>英文副标题</label>
    <input type="text" id="subtitle" maxlength="30" placeholder="选填，例如：BLUE SERIES 8500">

    <label>备注</label>
    <input type="text" id="remark" maxlength="50" placeholder="选填，例如：客户A / 双十一档期">
    <div class="hint">备注会显示在广告库的标题下面，方便区分来源和档期。</div>

    <label>广告视频</label>
    <div class="drop" id="videoDrop">
      <div class="big" id="videoBig">点击选择，或把视频拖进来</div>
      <div id="videoInfo">支持 mp4 / mov / avi，建议 5~15 秒</div>
    </div>
    <input type="file" id="video" accept="video/*" hidden>

    <label>封面图片</label>
    <div class="drop" id="coverDrop">
      <div class="big" id="coverBig">点击选择，或把图片拖进来</div>
      <div id="coverInfo">只传图片不传视频时必填；有视频可留空，自动取首帧</div>
    </div>
    <input type="file" id="cover" accept="image/*" hidden>

    <details>
      <summary>高级选项</summary>
      <div class="row2" style="margin-top:10px">
        <div>
          <label style="margin-top:0">视频帧率</label>
          <input type="number" id="fps" value="12" min="4" max="20">
          <div class="hint">板子上 12 最稳，15 勉强</div>
        </div>
        <div>
          <label style="margin-top:0">图片停留（秒）</label>
          <input type="number" id="hold" value="5" min="2" max="60">
          <div class="hint">只有图片广告时有效</div>
        </div>
      </div>
    </details>

    <button class="primary" id="submit">上传到广告机</button>

    <div class="progress" id="progress">
      <div class="bar"><i id="barFill"></i></div>
      <div class="ptext"><span id="stage">准备中</span><span id="percent">0%</span></div>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h2>已在广告机上</h2>
    <div class="list" id="list"><div class="empty">加载中…</div></div>
  </section>

</div>
</main>

<script>
const $ = (id) => document.getElementById(id);

function setMsg(text, kind) {
  const m = $("msg");
  m.textContent = text;
  m.className = "msg show " + (kind || "");
}

function pickFile(dropEl, inputEl, bigEl) {
  dropEl.onclick = () => inputEl.click();

  dropEl.ondragover = (e) => { e.preventDefault(); dropEl.classList.add("over"); };
  dropEl.ondragleave = () => dropEl.classList.remove("over");
  dropEl.ondrop = (e) => {
    e.preventDefault();
    dropEl.classList.remove("over");
    if (e.dataTransfer.files.length) {
      inputEl.files = e.dataTransfer.files;
      showName(dropEl, inputEl, bigEl);
    }
  };
  inputEl.onchange = () => showName(dropEl, inputEl, bigEl);
}

function showName(dropEl, inputEl, bigEl) {
  const f = inputEl.files[0];
  if (!f) return;
  const mb = (f.size / 1048576).toFixed(1);
  bigEl.textContent = f.name + "  ·  " + mb + " MB";
  dropEl.classList.add("has");
}

pickFile($("videoDrop"), $("video"), $("videoBig"));
pickFile($("coverDrop"), $("cover"), $("coverBig"));

async function refreshPing() {
  try {
    const r = await fetch("/api/ping");
    const j = await r.json();
    $("dot").className = "dot " + (j.ok ? "ok" : "bad");
    $("boardText").textContent = j.ok ? ("已连接 " + j.board) : ("未连接 " + j.board);
  } catch (e) {
    $("dot").className = "dot bad";
    $("boardText").textContent = "服务未响应";
  }
}

async function refreshList() {
  const box = $("list");
  try {
    const r = await fetch("/api/list");
    const j = await r.json();
    if (!j.ok) { box.innerHTML = '<div class="empty">读取失败：' + (j.error || "") + '</div>'; return; }
    if (!j.items.length) { box.innerHTML = '<div class="empty">还没有广告</div>'; return; }

    box.innerHTML = j.items.map((it) => `
      <div class="item">
        <span class="tag ${it.type === "视频" ? "v" : "i"}">${it.type}</span>
        <div class="it-body">
          <div class="it-title">${esc(it.title)}</div>
          ${it.remark ? `<div class="it-remark">${esc(it.remark)}</div>` : ""}
        </div>
        <button class="del" data-id="${esc(it.id)}">删除</button>
      </div>`).join("");

    box.querySelectorAll(".del").forEach((btn) => {
      btn.onclick = () => removeAd(btn.dataset.id, btn);
    });
  } catch (e) {
    box.innerHTML = '<div class="empty">读取失败</div>';
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function removeAd(id, btn) {
  if (!confirm("确定删除「" + id + "」这条广告？\n板上会立刻消失。")) return;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const body = new URLSearchParams({ id });
    const r = await fetch("/api/delete", { method: "POST", body });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "删除失败");
    await refreshList();
  } catch (e) {
    alert("删除失败：" + e.message);
    btn.disabled = false;
    btn.textContent = "删除";
  }
}

function pollStatus(jobId) {
  const timer = setInterval(async () => {
    try {
      const r = await fetch("/api/status?id=" + jobId);
      const j = await r.json();
      if (!j.ok) return;
      const job = j.job;
      $("stage").textContent = job.stage + (job.detail ? " · " + job.detail : "");
      $("percent").textContent = job.percent + "%";
      $("barFill").style.width = job.percent + "%";

      if (!job.done) return;
      clearInterval(timer);
      $("submit").disabled = false;

      if (job.error) {
        setMsg("上传失败：" + job.error, "err");
        $("stage").textContent = "失败";
      } else {
        setMsg("上传成功，广告已出现在广告机上", "ok");
        $("stage").textContent = "完成";
        $("title").value = ""; $("subtitle").value = ""; $("remark").value = "";
        [$("video"), $("cover")].forEach((inp) => { inp.value = ""; });
        $("videoBig").textContent = "点击选择，或把视频拖进来";
        $("coverBig").textContent = "点击选择，或把图片拖进来";
        $("videoDrop").classList.remove("has");
        $("coverDrop").classList.remove("has");
        refreshList();
      }
    } catch (e) { /* 网络抖动，下一轮继续 */ }
  }, 700);
}

$("submit").onclick = async () => {
  const title = $("title").value.trim();
  if (!title) { setMsg("请填写广告标题", "err"); $("title").focus(); return; }

  const video = $("video").files[0];
  const cover = $("cover").files[0];
  if (!video && !cover) { setMsg("至少要选一个视频或一张封面图", "err"); return; }

  const fd = new FormData();
  fd.append("title", title);
  fd.append("subtitle", $("subtitle").value.trim());
  fd.append("remark", $("remark").value.trim());
  fd.append("fps", $("fps").value);
  fd.append("hold", $("hold").value);
  if (video) fd.append("video", video, video.name);
  if (cover) fd.append("cover", cover, cover.name);

  $("submit").disabled = true;
  $("progress").classList.add("show");
  $("barFill").style.width = "0%";
  $("stage").textContent = "上传素材到本机…";
  $("percent").textContent = "0%";
  $("msg").className = "msg";

  try {
    const r = await fetch("/api/upload", { method: "POST", body: fd });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "上传失败");
    pollStatus(j.job);
  } catch (e) {
    $("submit").disabled = false;
    setMsg("上传失败：" + e.message, "err");
  }
};

refreshPing();
refreshList();
setInterval(refreshPing, 8000);
</script>
</body>
</html>
